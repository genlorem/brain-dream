  - 'heading "2. Brain MCP stdio→http: RAM растёт O(n) с числом сессий, а не O(1)" [level=2] [ref=e23]'
  - paragraph [ref=e24]:
    - strong [ref=e25]: Суть.
    - text: При stdio-транспорте embedding-модель (~1 ГБ) загружается в каждую CC-сессию отдельно. На 9 сессиях — ~2.8 ГБ. Единый http-демон держит ~1.1 ГБ на всех. Экономия линейна с числом сессий.
  - paragraph [ref=e26]:
    - strong [ref=e27]: Почему важно.
    - text: MCP-серверы воспринимаются как лёгкие обёртки; факт что embedding-модель = отдельный процесс на сессию всплывает только после OOM. Это не гипотетический риск — VPS уже получал OOM-hardening без знания root cause.
  - paragraph [ref=e28]:
    - strong [ref=e29]: Действие.
    - text: Перевести brain MCP на http-демон по процедуре
    - code [ref=e30]: procedure:brain-http-daemon
    - text: . Проверить, покрывает ли
    - code [ref=e31]: decision:2026-06-04-vps-oom-hardening
    - text: ONNX-специфичные меры (arena_extend_strategy), или только симптом (общий RSS).
  - paragraph [ref=e32]:
    - strong [ref=e33]: "Sources:"
    - code [ref=e34]: procedure:brain-http-daemon
    - text: "|"
    - strong [ref=e35]: non-obvious
  - separator [ref=e36]
  - heading "3. Выход Балина блокирует дивиденды Андрея — окно для fix открыто пока ИП активно" [level=2] [ref=e37]
  - paragraph [ref=e38]:
    - strong [ref=e39]: Суть.
    - text: Андрей получает свои 2.5% не напрямую, а через ИП Балина под видом «услуг». Когда Балин закроет ИП при выходе — единственный механизм выплат исчезнет, хотя доля Андрея остаётся. Два события (выход учредителя и закрытие ИП) могут произойти в разное время — проблема возникает именно при закрытии ИП, не раньше.
  - paragraph [ref=e40]:
    - strong [ref=e41]: Почему важно.
    - text: "Кипрскую юрисдикцию перенесли в КЗ проактивно, до блокировки. Здесь — реактивная ситуация: канал уже описан как «блокер», но нового механизма нет. Пока ИП Балина работает — есть окно."
  - paragraph [ref=e42]:
    - strong [ref=e43]: Действие.
    - text: Закрыть новый маршрут выплат Андрею (прямой договор ГПХ, КЗ-сущность или иной) до закрытия ИП Балина. Зафиксировать решение как
    - code [ref=e44]: decision:marquiz/andrei-new-payout-route
    - text: .
  - paragraph [ref=e45]:
    - strong [ref=e46]: "Sources:"
    - code [ref=e47]: decision:marquiz/andrei-payouts
    - text: ","
    - code [ref=e48]: decision:marquiz/andrei-balin-option
    - text: "|"
    - strong [ref=e49]: non-obvious
