  - 'heading "5. МойСклад: один токен на 4+ сервиса — каскадное падение без процедуры ротации" [level=2] [ref=e68]'
  - paragraph [ref=e69]:
    - strong [ref=e70]: Суть.
    - text: synapse-prod, skvo-fabric, skvo-controller, cdek-bot используют один токен ИП Балачков в МС. 49 зависших вебхуков TopSeller/mpsklad висели на том же аккаунте незамеченными — обнаружены только через угрозу МС автоотключить их. Блокировка/ротация токена или rate-limit немедленно кладёт все сервисы без изолированных ошибок.
  - paragraph [ref=e71]:
    - strong [ref=e72]: Почему важно.
    - text: МС уже грозил авто-отключением за таймауты. Компрометация или плановая ротация — единственный вектор для каскадного падения четырёх несвязанных сервисов. Ни один из них не мониторит статус аккаунта независимо.
  - paragraph [ref=e73]:
    - strong [ref=e74]: Действие.
    - text: Завести
    - code [ref=e75]: procedure:moysklad-token-rotation
    - text: с шагами изоляции токенов по сервисам и планом действий при компрометации. Добавить health-check пинг МС-аккаунта в мониторинг.
  - paragraph [ref=e76]:
    - strong [ref=e77]: "Sources:"
    - code [ref=e78]: decision:moysklad-topseller-webhooks-decommission
    - text: "|"
    - strong [ref=e79]: non-obvious
  - separator [ref=e80]
  - heading "6. Playwright MCP накапливает браузеры в долгоживущих сессиях — reaper написан, но не задеплоен" [level=2] [ref=e81]
  - paragraph [ref=e82]:
    - strong [ref=e83]: Суть.
    - text: Браузер привязан к CC-сессии, а не к use-case.
    - code [ref=e84]: browser_close
    - text: никто не вызывает → 52 chrome-процесса и +3.6 ГБ профилей до обнаружения. Процедура гашения idle-браузеров создана после инцидента 2026-06-10, но в Brain нет узла, подтверждающего что reaper реально запущен как cron или systemd-таймер на VPS.
  - paragraph [ref=e85]:
    - strong [ref=e86]: Почему важно.
    - text: Без задеплоенного reaper'а накопление повторится. OOM-hardening снижает риск, но не устраняет первопричину. Дисковый рост (+3.6 ГБ профилей) — второй скрытый вектор, который заметят позже RAM.
  - paragraph [ref=e87]:
    - strong [ref=e88]: Действие.
    - text: Задеплоить
    - code [ref=e89]: procedure:playwright-mcp-reaper
    - text: как cron/systemd-таймер на VPS. Создать ноду
    - code [ref=e90]: event:playwright-reaper-deployed-<date>
    - text: после деплоя.
  - paragraph [ref=e91]:
    - strong [ref=e92]: "Sources:"
    - code [ref=e93]: procedure:playwright-mcp-reaper
    - text: ","
    - code [ref=e94]: decision:2026-06-04-vps-oom-hardening
    - text: "|"
    - strong [ref=e95]: non-obvious
