  - 'heading "8. Govori: LS-биллинг несовместим с IAP + покупатели видят «HanziHunt» вместо «Govori»" [level=2] [ref=e113]'
  - paragraph [ref=e114]:
    - strong [ref=e115]: Суть.
    - text: (А) tokens.py построен вокруг LS License Key. Apple IAP и Play Billing не выдают license key — при выходе в стор rebind/revoke логика сломается. (Б) Продукт «Govori month» продаётся через LS-магазин HanziHunt (id 340506). Покупатель видит в выписке «HanziHunt», а не «Govori» — сломанное доверие и потенциальное нарушение ToS LS.
  - paragraph [ref=e116]:
    - strong [ref=e117]: Почему важно.
    - text: Оба решения приняты независимо, конфликт невидим пока нет стор-публикации. Phase 2 (dispatch_command/do) строится поверх нерешённого billing-блокера, что заставит адаптировать Phase 2-фичи под два payment path после реализации.
  - paragraph [ref=e118]:
    - strong [ref=e119]: Действие.
    - text: "(А) Создать отдельный IAP-путь в tokens.py или принять решение: store-версия = отдельный billing бэкенд. (Б) Переименовать LS-магазин на «Govori» до публикации в стор."
  - paragraph [ref=e120]:
    - strong [ref=e121]: "Sources:"
    - code [ref=e122]: decision:govori-store-billing-open
    - text: ","
    - code [ref=e123]: decision:govori-per-device-tokens
    - text: ","
