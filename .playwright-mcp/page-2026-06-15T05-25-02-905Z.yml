  - 'heading "9. SKVO: аналитический backbone без владельца решений + 90 дней данных без сезонности" [level=2] [ref=e128]'
  - paragraph [ref=e129]:
    - strong [ref=e130]: Суть.
    - text: "synapse работает (заказы, выручка, остатки WB/Ozon/YM, 90-дневное окно), но маркетинг-лид — «главный рычаг 2026» — не нанят и роль не описана. Одновременно 90 дней захватывают только Q4-Q1 (пик продаж). Стратегические решения по 280 SKU принимаются без year-over-year сравнения: невозможно отличить сезонный всплеск от реального роста."
  - paragraph [ref=e131]:
    - strong [ref=e132]: Почему важно.
    - text: 90-дневное скользящее окно ротируется без применения. Маркетплейсы штрафуют за низкую оборачиваемость, а данных для ABC-анализа уже достаточно для быстрого старта. Без лида инфраструктура накапливает данные впустую.
  - paragraph [ref=e133]:
    - strong [ref=e134]: Действие.
    - text: "(А) Запустить ABC-анализ: один SQL-запрос"
    - code [ref=e135]: net_payout/SKU
    - text: из synapse → заморозить bottom-50% позиций в следующем производственном цикле. (Б) Запросить исторические выгрузки из API маркетплейсов (Ozon/WB/ЯМ) прямо сейчас — архивировать снапшоты пока window не вырос сам.
  - paragraph [ref=e136]:
    - strong [ref=e137]: "Sources:"
    - code [ref=e138]: note:skvo/marketing-lead-gap
    - text: ","
    - code [ref=e139]: note:skvo/data-backbone
    - text: ","
    - code [ref=e140]: note:skvo/strategy-data-map
    - text: "|"
    - strong [ref=e141]: non-obvious
    - text: (сезонность),
    - strong [ref=e142]: obvious
    - text: (роль лида)
  - separator [ref=e143]
  - heading "10. Флоу «ещё один заказ» для юрлиц системно сломан — два независимых бага, ноль регрессионных сценариев" [level=2] [ref=e144]
  - paragraph [ref=e145]:
    - strong [ref=e146]: Суть.
    - text: "VIP-7063 (предзаполнение не подтягивается без ручного нажатия) и VIP-7660 (заказ нельзя оформить при совпадающих адресах) — оба в одном флоу: повторный заказ юрлица. Найдены разными людьми в разное время → флоу никогда не проходили end-to-end для юрлиц. Плюс: все юрлицо-баги воспроизводятся только через один ручной тест-аккаунт"
    - code [ref=e147]: sempertuarn@proton.me
    - text: — единственная точка входа для этого класса тестов.
  - paragraph [ref=e148]:
    - strong [ref=e149]: Почему важно.
    - text: Повторный заказ — максимально конверсионный путь (пользователь уже доверяет сервису). Системная поломка здесь = прямые потери. Зависимость от одного аккаунта = новые юрлицо-баги будут обнаруживаться случайно у клиентов.
  - paragraph [ref=e150]:
    - strong [ref=e151]: Действие.
    - text: Создать регрессионный сценарий для флоу «юрлицо → повторный заказ» в чеклисте QA. Задокументировать конфигурацию тест-аккаунта в Tracker, не в головах.
  - paragraph [ref=e152]:
    - strong [ref=e153]: "Sources:"
    - code [ref=e154]: task:VIP-7063
    - text: ","
    - code [ref=e155]: task:VIP-7660
    - text: ","
    - code [ref=e156]: task:VIP-7314
    - text: "|"
    - strong [ref=e157]: non-obvious
