    - strong [ref=e58]: Почему важно.
    - text: "Пользователь, кликая «рестарт» из привычки, незаметно терял весь контекст. Урок зафиксирован, но не проверено: исправлена ли кнопка и добавлен ли явный лейбл («Resume» vs «New session»)."
  - paragraph [ref=e59]:
