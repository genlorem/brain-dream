  - heading "7. АстанаХаб 0% недостижим — весь клиентский оборот идёт мимо КЗ-юрлица" [level=2] [ref=e97]
  - paragraph [ref=e98]:
    - strong [ref=e99]: Суть.
    - text: "Цель кипрской миграции — нулевой налог через АстанаХаб КЗ. Но весь клиентский оборот Marquiz идёт на ИП Балачков (РФ-юрисдикция). КЗ-юрлицо получит 0% только со своих доходов — а основной поток мимо него. Плюс: PayPro-поток юридически принадлежит ТОО, единственным учредителем которого является Геннадий — наёмный менеджер без доли в РФ-ООО. Если Геннадий уходит — международный биллинг в руинах без механизма перехода."
  - paragraph [ref=e100]:
    - strong [ref=e101]: Почему важно.
    - text: "Два решения (миграция в КЗ и лицензионная схема) приняты независимо и создают структурное противоречие: налоговая экономия мотивировала миграцию, но реальная ставка не меняется пока права на ПО и клиентские платежи не перенесены на КЗ-сущность."
  - paragraph [ref=e102]:
    - strong [ref=e103]: Действие.
    - text: "Проверить с юристом: при каких условиях КЗ-юрлицо получает реальный оборот, а не транзитный. Зафиксировать как"
    - code [ref=e104]: decision:marquiz/kz-revenue-routing-plan
    - text: .
